<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>UNO Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/favicon-32.png">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UNO Lab">
<style>
  :root { --bg:#f5f6f8; --card:#ffffff; --bordo:#e2e5ea; --fg:#1b1f27; --mut:#646b78; --acc:#1f6fd1; --ok:#16a065; --err:#d43c3c; --warn:#e0a800; --tasto:#eef1f5; }
  * { box-sizing:border-box; }
  html { -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:12px 16px;
           background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--bordo); }
  header strong { font-size:1.1rem; }
  .chip { flex:1; font-size:.8rem; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip.on { color:var(--ok); } .chip.err { color:var(--err); }
  main { max-width:520px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:1.4rem; margin:0; } h2 { font-size:1.05rem; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  p { margin:0; }
  #app { display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--card); border:1px solid var(--bordo); box-shadow:0 1px 3px rgba(20,30,50,.05); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .card.avviso { background:#fff8e1; border-color:#f0dc9a; color:#6b5200; }
  .card.errore { background:#fdecec; border-color:#f3c2c2; color:#9b2222; }
  .progetto.attivo { outline:2px solid var(--ok); }
  .testa { display:flex; gap:12px; align-items:flex-start; }
  .testa p { color:var(--mut); font-size:.9rem; line-height:1.35; }
  .icona { font-size:1.8rem; line-height:1; }
  .badge { font-size:.7rem; background:var(--ok); color:#fff; padding:2px 8px; border-radius:99px; font-weight:700; }
  details summary { cursor:pointer; color:var(--acc); font-size:.9rem; }
  details ul { margin:8px 0 0; padding-left:20px; color:#394150; font-size:.9rem; line-height:1.6; }
  button, select { font:inherit; border:0; border-radius:12px; padding:12px 14px; background:var(--tasto); color:var(--fg); cursor:pointer; }
  button.primario { background:var(--acc); color:#fff; font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  button.largo { width:100%; padding:16px; }
  button.indietro { align-self:flex-start; background:none; color:var(--acc); padding:4px 0; }
  a.guida { display:inline-block; margin-top:10px; color:var(--acc); font-size:.9rem; text-decoration:none; }
  .colonna { display:flex; flex-direction:column; gap:12px; }
  .schede { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--tasto); padding:4px; border-radius:14px; }
  .schede button { background:none; padding:10px 0; }
  .schede button.attiva { background:#fff; color:var(--acc); font-weight:600; box-shadow:0 1px 3px rgba(20,30,50,.12); }
  .distanza { text-align:center; font-size:1.8rem; font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums; }
  .riga { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .riga > button { flex:1; }
  .griglia3, .griglia5, .griglia7 { display:grid; gap:8px; }
  .griglia3 { grid-template-columns:repeat(3,1fr); } .griglia5 { grid-template-columns:repeat(5,1fr); }
  .griglia7 { grid-template-columns:repeat(7,1fr); }
  .griglia5 button { padding:12px 0; }
  .progresso { height:10px; background:var(--tasto); border-radius:99px; overflow:hidden; }
  .progresso > div { height:100%; width:0; background:var(--acc); transition:width .15s; }
  .fase { font-size:.85rem; color:var(--mut); }
  .grande { text-align:center; font-size:2.6rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .etichetta { font-size:.85rem; color:var(--mut); display:flex; flex-direction:column; gap:4px; }
  input[type=range] { width:100%; height:40px; accent-color:var(--acc); }
  input[type=color] { width:64px; height:64px; border:0; background:none; padding:0; }
  .anteprima { flex:1; height:64px; border-radius:12px; background:#000; border:1px solid var(--bordo); }
  .campione { aspect-ratio:1; padding:0; border:2px solid var(--bordo); }
  .quadrante { position:relative; width:220px; height:120px; margin:0 auto; overflow:hidden;
               border-radius:220px 220px 0 0; background:var(--tasto); }
  .lancetta { position:absolute; left:107px; bottom:0; width:6px; height:100px; background:var(--acc);
              border-radius:3px; transform-origin:50% 100%; transition:transform .1s; }
  .perno { position:absolute; left:100px; bottom:-10px; width:20px; height:20px; border-radius:50%; background:var(--fg); }
  .barra { height:14px; background:var(--tasto); border-radius:99px; overflow:hidden; }
  .barra-piena { height:100%; width:0; background:var(--warn); }
  .grafico { width:100%; height:auto; background:#f8f9fb; border:1px solid var(--bordo); border-radius:12px; }
  .tastiera { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; }
  .tasto { background:#fff; color:#111; border:1px solid #cfd4dc; height:130px; padding:0 0 10px; display:flex; align-items:flex-end;
           justify-content:center; font-weight:600; font-size:.8rem; border-radius:0 0 10px 10px; touch-action:manipulation; }
  .tasto:active { background:var(--acc); color:#fff; }
  /* progetti */
  h3.livello { margin:10px 0 -4px; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  .num { display:inline-grid; place-items:center; min-width:24px; height:24px; border-radius:7px; background:var(--tasto); color:var(--mut); font-size:.75rem; }
  .centro { text-align:center; justify-content:center; }
  .schede.due { grid-template-columns:1fr 1fr; }
  .griglia2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .griglia4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; } .griglia4 button { padding:12px 0; font-size:.85rem; }
  .griglia6 { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; } .griglia6 button { padding:12px 0; }
  .semaforo { width:110px; margin:6px auto; padding:14px; background:#2b2f36; border-radius:22px; display:flex; flex-direction:column; gap:12px; }
  .lampada { width:82px; height:82px; border-radius:50%; background:#4a4f58; cursor:pointer; transition:background .15s, box-shadow .15s; }
  .lampada.on { box-shadow:0 0 22px currentColor; }
  .lampada.piccola { width:54px; height:54px; cursor:default; border:1px solid var(--bordo); }
  .card-spia { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border:1px solid var(--bordo); border-radius:14px; font-size:.85rem; text-align:center; }
  .spia { width:44px; height:44px; border-radius:50%; background:var(--tasto); border:2px solid var(--bordo); transition:.1s; }
  .riga .spia { width:22px; height:22px; }
  .spia.on { background:var(--ok); border-color:var(--ok); box-shadow:0 0 12px rgba(22,160,101,.5); }
  .conta { font-size:1.3rem; font-weight:700; color:var(--acc); min-height:1.5em; }
  .misura { border:1px solid var(--bordo); border-radius:14px; padding:10px; }
  .misura .grande { font-size:1.9rem; }
  .legenda { text-align:center; }
  .pad { position:relative; width:min(78vw,300px); aspect-ratio:1; margin:0 auto; border-radius:18px; background:var(--tasto); border:1px solid var(--bordo); overflow:hidden; }
  .croce-x, .croce-y { position:absolute; background:var(--bordo); } .croce-x { left:0; right:0; top:50%; height:1px; } .croce-y { top:0; bottom:0; left:50%; width:1px; }
  .punto { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; background:var(--acc); box-shadow:0 2px 8px rgba(31,111,209,.4); transition:left .05s, top .05s; }
  .punto.premuto { background:var(--err); transform:scale(1.3); }
  .stato-allarme { text-align:center; font-size:1.6rem; font-weight:700; padding:18px; border-radius:14px; background:var(--tasto); }
  .stato-allarme.attivo { background:#e6f6ee; color:#0f7a4c; }
  .stato-allarme.allarme { background:#fdecec; color:#c02626; animation:lampeggio .4s infinite alternate; }
  @keyframes lampeggio { to { background:#f8c9c9; } }
  .registro-eventi { margin:0; padding-left:18px; font-size:.85rem; color:var(--mut); line-height:1.6; }
  .telecomando { width:220px; margin:0 auto; padding:16px; background:#2b2f36; border-radius:28px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .tasto-ir { aspect-ratio:1; border-radius:50%; background:#444a54; color:#fff; display:grid; place-items:center; font-size:.72rem; font-weight:600; transition:.1s; }
  .tasto-ir.rosso { background:#c23a3a; }
  .tasto-ir.premuto { background:var(--acc); transform:scale(1.15); box-shadow:0 0 14px rgba(31,111,209,.8); }
  .ledbar { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; direction:rtl; }
  .led8 { direction:ltr; aspect-ratio:1; padding:0; border-radius:50%; font-size:.68rem; color:var(--mut); border:2px solid var(--bordo); background:#fff; }
  .led8.on { background:#e84a4a; border-color:#e84a4a; color:#fff; box-shadow:0 0 10px rgba(232,74,74,.6); }
  .display7 { width:120px; margin:0 auto; display:block; background:#2b2f36; border-radius:12px; padding:10px; }
  .display7 rect, .display7 circle { fill:#3c3f45; transition:fill .1s; }
  .display7 .on { fill:#ff4d3d; }
  input.testo { font:inherit; font-family:ui-monospace,monospace; padding:12px; border:1px solid var(--bordo); border-radius:12px; background:#fff; color:var(--fg); }
  .lcdbox { font-family:ui-monospace,monospace; font-size:clamp(13px,4.4vw,19px); background:#3d7be0; color:#eaf2ff; padding:12px 10px; border-radius:8px; border:6px solid #1d3f7a; white-space:pre; letter-spacing:.06em; overflow:hidden; }
  .elica { font-size:110px; line-height:1; text-align:center; color:var(--acc); }
  .quadrante-tondo { width:min(70vw,260px); margin:0 auto; display:block; cursor:pointer; }
  .info-batteria { background:#eef7f1; border-color:#cfe9d9; color:#174d31; }
  .info-batteria p { font-size:.88rem; line-height:1.4; }
  .archi { display:flex; gap:8px; justify-content:center; align-items:flex-end; height:90px; }
  .arco { width:48px; border-radius:8px; background:var(--tasto); border:2px solid var(--bordo); }
  .arco:nth-child(1) { height:30%; } .arco:nth-child(2) { height:55%; } .arco:nth-child(3) { height:80%; } .arco:nth-child(4) { height:100%; }
  .arco.on { background:var(--c); border-color:var(--c); }
  .dado { width:150px; aspect-ratio:1; margin:6px auto; padding:16px; background:#fff; border:2px solid var(--bordo); border-radius:26px;
          box-shadow:0 4px 14px rgba(20,30,50,.12); display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pip { border-radius:50%; } .pip.on { background:#1b1f27; }
  .cifre4 { font-family:ui-monospace,monospace; font-size:3.4rem; font-weight:700; text-align:center; color:#ff4d3d; background:#2b2f36; border-radius:14px; padding:14px 0; letter-spacing:.12em; }
  .barra.rel { position:relative; overflow:visible; }
  .soglia { position:absolute; top:-5px; bottom:-5px; width:3px; background:var(--fg); border-radius:2px; }
  .lampada.grande-l { width:110px; height:110px; margin:0 auto; cursor:default; border:1px solid var(--bordo); transition:background .2s, box-shadow .2s; }
  .elica.piccola-elica { font-size:70px; }
  .app-android summary { color:var(--acc); font-weight:600; }
  .app-android p { font-size:.88rem; color:var(--mut); }
  a.pulsante-link { display:block; text-align:center; padding:12px; border-radius:12px; background:var(--acc); color:#fff; font-weight:600; text-decoration:none; }
  header { padding-top:calc(12px + env(safe-area-inset-top, 0px)); }
  .legenda-tasti { margin:0; padding-left:18px; font-size:.88rem; line-height:1.7; }
  #registro summary { font-size:.85rem; color:var(--mut); }
  #log { font:12px/1.4 ui-monospace,monospace; color:var(--mut); max-height:180px; overflow:auto; white-space:pre-wrap; margin:8px 0 0; }
</style>
</head>
<body>
  <header>
    <strong>UNO Lab</strong>
    <span id="chip" class="chip">…</span>
    <button id="btnInstalla" hidden>Installa</button>
    <button id="btnConnetti" class="primario">Collega</button>
  </header>
  <main>
    <div id="app"></div>
    <details id="registro" class="card"><summary>Registro comunicazioni</summary><pre id="log"></pre></details>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
